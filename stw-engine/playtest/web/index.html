<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020609">
    <title>Save The World</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="game" aria-label="Real STW game stream">
      <img id="frame" alt="Live frame from the native STW OpenGL renderer">
      <div id="connecting" class="connecting">
        <strong>SAVE THE WORLD</strong>
        <span id="connecting-text">Connecting to native STW…</span>
      </div>

      <button id="menu-start" class="menu-start" type="button">
        <strong>DEPLOY</strong>
        <span>Enter training map</span>
      </button>

      <section id="hud" class="hud" aria-live="polite">
        <button id="hud-toggle" type="button" aria-label="Toggle diagnostics">STW</button>
        <div id="hud-details">
          <span id="connection">CONNECTING</span>
          <span id="scene">main-menu</span>
          <span><b id="rx-fps">0.0</b> rx fps</span>
          <span><b id="native-fps">0.0</b> native fps</span>
          <span id="weapon">M16</span>
          <span><b id="animation-state">Idle</b> animation</span>
          <span id="animation-clip">clip —</span>
          <span><b id="animation-time">0.00</b> anim s</span>
          <span id="last-error">no error</span>
        </div>
      </section>

      <div class="crosshair" aria-hidden="true"></div>

      <div id="move-pad" class="pad move-pad" aria-label="Move">
        <span>MOVE</span><i id="move-knob"></i>
      </div>
      <div id="look-pad" class="look-pad" aria-label="Look"></div>

      <div class="actions">
        <button id="fire" class="fire" type="button">FIRE</button>
        <button id="sprint" type="button">SPRINT</button>
        <button id="weapon-button" type="button">WEAPON</button>
        <button id="pause" type="button">PAUSE</button>
        <button id="reset" type="button">RESET</button>
      </div>

      <p class="desktop-help">WASD · mouse · click fire · Shift sprint · Q weapon · R reset</p>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
