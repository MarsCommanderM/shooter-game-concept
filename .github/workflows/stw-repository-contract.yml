name: STW Repository Contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stw-repository-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository identity and active-tree guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify repository contract
        shell: bash
        run: bash tools/stw-repo-guard.sh ci
