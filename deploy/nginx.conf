# WIRRWARR – Nginx-Reverse-Proxy (HTTP + WebSocket auf einer Domain)
# server.mjs bedient Next.js UND /ws auf Port 3000 – Nginx reicht alles durch.
server {
    listen 80;
    server_name wirrwarr.DEINE-DOMAIN.de;   # <- anpassen

    # Für Let's Encrypt / Certbot zuerst HTTP, dann auf 443 erweitern.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WICHTIG für den Online-Modus: WebSocket-Upgrade durchreichen
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Lange Matches, lange Sockets
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
