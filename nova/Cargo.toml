[workspace]
resolver = "2"
members = ["crates/core", "crates/client", "crates/server", "crates/probe", "crates/glslcheck"]

[workspace.dependencies]
glam = { version = "0.28", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
gltf = "1.4"

[profile.release]
opt-level = 3
