<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SAVE THE WORLD // NOVA-Web-Client</title>
<style>
  html, body { margin: 0; padding: 0; background: #050705; overflow: hidden; overscroll-behavior: none; height: 100%; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10; color: #22ff55;
    font: 11px/1.5 monospace; letter-spacing: 0.1em; text-transform: uppercase;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(34,255,85,0.35);
    padding: 8px 12px; pointer-events: none; white-space: pre-line;
  }
  #hpwrap { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; pointer-events: none; }
  #hpnum { color: #22ff55; font: bold 22px monospace; }
  #hpbar { width: 160px; height: 6px; background: #22ff55; margin-top: 3px; border-radius: 3px; }
  #feed { position: fixed; right: 12px; top: 12px; z-index: 10; color: #baffc9; text-align: right;
    font: 11px/1.6 monospace; white-space: pre-line; pointer-events: none; text-shadow: 0 0 6px rgba(34,255,85,.6); }
  #fire {
    position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(5rem + env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%; z-index: 11;
    border: 2px solid rgba(34,255,85,0.7); background: rgba(34,255,85,0.22);
    color: #22ff55; font: bold 14px monospace; letter-spacing: .1em;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #fire:active { background: rgba(34,255,85,0.5); }
  #respawn { position: fixed; inset: 0; z-index: 12; display: none; align-items: center; justify-content: center;
    background: rgba(120,0,0,0.35); color: #ff5544; font: bold 26px monospace; letter-spacing: .3em; pointer-events: none; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #22ff55; font: 13px monospace; letter-spacing: .15em; text-transform: uppercase;
    pointer-events: none; z-index: 9; text-align: center;
  }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<div id="hud">NOVA // lade…</div>
<div id="score" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;color:#22ff55;font:bold 14px monospace;letter-spacing:.2em;background:rgba(0,0,0,.55);border:1px solid rgba(34,255,85,.35);padding:6px 14px;pointer-events:none">GRÜN 0 : 0 ROT</div>
<div id="hpwrap"><span id="hpnum">100</span><div id="hpbar"></div></div>
<div id="feed"></div>
<button id="fire">FEUER</button>
<button id="weap" style="position:fixed;right:calc(8.5rem + env(safe-area-inset-right));bottom:calc(5.6rem + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;z-index:11;border:2px solid rgba(34,255,85,.5);background:rgba(34,255,85,.12);color:#22ff55;font:bold 10px monospace;letter-spacing:.08em;touch-action:none">WAFFE</button>
<div id="banner"></div>
<div id="respawn">ELIMINIERT – RESPAWN…</div>
<div id="hint">TOUCH: LINKS STICK · RECHTS LOOK · FEUER = PUMP<br/>PC: KLICK = LOCK+FEUER · WASD · SHIFT</div>
<script>
  window.addEventListener('error', (e) => {
    const h = document.getElementById('hud');
    if (h) h.textContent = 'JS-FEHLER: ' + (e.message || e) + '\nScreenshot schicken!';
  });
  window.addEventListener('unhandledrejection', (e) => {
    const h = document.getElementById('hud');
    if (h) h.textContent = 'ASYNC-FEHLER: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
</script>
<script type="module">
  const hud = document.getElementById('hud');
  const hint = document.getElementById('hint');
  try {
    const mod = await import('./nova-client.js?v=k3');
    const init = mod.default;
    hud.textContent = 'NOVA // lade Engine (2.3 MB)…';
    const wasm = await fetch('./nova-client_bg.wasm?v=k3');
    const buf = await wasm.arrayBuffer();
    hud.textContent = 'NOVA // starte Engine…';
    await init(buf);
    const fire = document.getElementById('fire');
    const down = (e) => { e.preventDefault(); mod.nova_fire(true); };
    const up = (e) => { e.preventDefault(); mod.nova_fire(false); };
    fire.addEventListener('touchstart', down, { passive: false });
    fire.addEventListener('touchend', up);
    fire.addEventListener('touchcancel', up);
    fire.addEventListener('mousedown', down);
    fire.addEventListener('mouseup', up);
    const weap = document.getElementById('weap');
    weap.addEventListener('touchstart', (e) => { e.preventDefault(); mod.nova_weap(); }, { passive: false });
    weap.addEventListener('click', () => mod.nova_weap());
    setTimeout(() => { hint.style.display = 'none'; }, 7000);
    if (!hud.textContent.includes('CRUMB')) hud.textContent = 'SAVE THE WORLD // NOVA\nMAP: SHARD CITY LITE\nSERVER: ' + location.hostname;
  } catch (e) {
    hud.textContent = 'FEHLER: ' + e + '\nURL pruefen: http://169.58.152.88:3000./';
    console.error(e);
  }
</script>
</body>
</html>
