[package]
name = "nova-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nova-client"
path = "src/main.rs"

[dependencies]
nova-core = { path = "../core" }
glam = { workspace = true }
wgpu = { workspace = true, features = ["webgl"] }
winit = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
gltf = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Window", "Document", "HtmlElement", "HtmlCanvasElement", "Node", "Location", "TouchEvent", "Touch", "TouchList", "BinaryType", "AudioContext", "BaseAudioContext", "OscillatorNode", "GainNode", "AudioNode", "AudioParam", "AudioDestinationNode", "OscillatorType", "AudioBuffer", "AudioBufferSourceNode", "BiquadFilterNode", "BiquadFilterType", "Performance"] }
